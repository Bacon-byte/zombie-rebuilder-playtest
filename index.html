<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121820">
  <link rel="icon" href="data:,">
  <title>Zombie Rebuilder - Movement Prototype</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #121820; color: #edf5f3;
      font: 16px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    #app { height: 100%; height: 100dvh; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center;
      padding: max(12px, var(--safe-top, env(safe-area-inset-top))) max(12px, var(--safe-right, env(safe-area-inset-right)))
        max(12px, var(--safe-bottom, env(safe-area-inset-bottom))) max(12px, var(--safe-left, env(safe-area-inset-left))); }
    #stage { grid-column: 2; grid-row: 1; align-self: stretch; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-content: center;
      padding: 16px; background: #121820; text-align: center; white-space: pre-line; }
    #status[hidden] { display: none; }
    aside { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; gap: 12px; }
    p { margin: 0; text-align: center; max-width: 24em; font-size: 14px; }
    #pad { display: grid; grid-template: repeat(3, 44px) / repeat(3, 44px); gap: 4px;
      touch-action: none; user-select: none; -webkit-user-select: none; }
    #pad button, #dodge { min-width: 44px; min-height: 44px; border: 2px solid #89ada4; border-radius: 12px;
      background: #253e38; color: white; font: 28px system-ui; touch-action: none;
      -webkit-touch-callout: none; }
    #pad button[aria-pressed="true"], #dodge[aria-pressed="true"] { background: #387866; }
    #pad button:focus-visible, #dodge:focus-visible { outline: 3px solid #f4c570; outline-offset: 2px; }
    #pad button:disabled, #dodge:disabled { opacity: .4; }
    [data-direction="up"] { grid-area: 1 / 2; }
    [data-direction="left"] { grid-area: 2 / 1; }
    [data-direction="right"] { grid-area: 2 / 3; }
    [data-direction="down"] { grid-area: 3 / 2; }
    [data-direction="up-left"] { grid-area: 1 / 1; }
    [data-direction="up-right"] { grid-area: 1 / 3; }
    [data-direction="down-left"] { grid-area: 3 / 1; }
    [data-direction="down-right"] { grid-area: 3 / 3; }
    #actions { grid-column: 3; grid-row: 1; align-self: end; padding-bottom: 16px; }
    #dodge { width: 64px; height: 64px; font-size: 14px; border-radius: 50%; }
    .arrow { display: inline-block; width: 12px; height: 12px; border-top: 3px solid currentColor;
      border-right: 3px solid currentColor; transform: rotate(var(--angle)); }
    #rotate { display: none; }
    #pad { align-self: end; }
    aside p { max-width: 148px; font-size: 12px; }
    #canvas { image-rendering: pixelated; }
    @media (orientation: portrait) {
      #app { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto; }
      #stage { grid-column: 1 / -1; grid-row: 1; }
      aside { grid-column: 1; grid-row: 2; }
      #actions { grid-column: 2; grid-row: 2; }
      #rotate { display: inline; }
    }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <main id="app">
    <section id="stage" aria-label="Placeholder movement arena">
      <canvas id="canvas" tabindex="0" aria-label="Game. WASD or arrows to move; Space to dodge."></canvas>
      <div id="status" role="status">Loading playtest…</div>
    </section>
    <aside aria-label="Movement controls">
      <p>Move the teal square.<br>WASD / arrows<br>Space: dodge</p>
      <div id="pad" role="group" aria-label="Eight-direction movement pad">
        <button type="button" data-direction="up-left" aria-label="Move up left" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 270deg"></span></button>
        <button type="button" data-direction="up-right" aria-label="Move up right" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 0deg"></span></button>
        <button type="button" data-direction="down-left" aria-label="Move down left" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 180deg"></span></button>
        <button type="button" data-direction="down-right" aria-label="Move down right" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 90deg"></span></button>
        <button type="button" data-direction="up" aria-label="Move up" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 315deg"></span></button>
        <button type="button" data-direction="left" aria-label="Move left" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 225deg"></span></button>
        <button type="button" data-direction="right" aria-label="Move right" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 45deg"></span></button>
        <button type="button" data-direction="down" aria-label="Move down" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 135deg"></span></button>
      </div>
      <p>Technical playtest · placeholder art<br><span id="rotate">Rotate for a wider arena.</span></p>
    </aside>
    <div id="actions"><button id="dodge" type="button" data-direction="dodge" aria-label="Dodge" aria-pressed="false" disabled>Dodge</button></div>
  </main>
  <noscript>JavaScript is required to run this playtest.</noscript>
  <script src="index.js"></script>
  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const buttons = [...document.querySelectorAll('button[data-direction]')];
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], "up-left": [-1, -1], "up-right": [1, -1], "down-left": [-1, 1], "down-right": [1, 1] };
    const pointers = new Map();
    let receiver = null;

    function publish(dodge = false, reset = false) {
      let x = 0, y = 0;
      const held = new Set(pointers.values());
      for (const direction of held) {
        if (!vectors[direction]) continue;
        x += vectors[direction][0]; y += vectors[direction][1];
      }
      for (const button of buttons) button.setAttribute('aria-pressed', String(held.has(button.dataset.direction)));
      if (receiver) receiver(x, y, dodge, reset);
    }
    function clearInput() { pointers.clear(); publish(false, true); }
    window.playtestControls = {
      ready: false,
      bind(callback) {
        receiver = callback;
        this.ready = true;
        for (const button of buttons) button.disabled = false;
        clearInput();
      },
      unbind() {
        clearInput(); receiver = null; this.ready = false;
        for (const button of buttons) button.disabled = true;
      }
    };
    for (const button of buttons) {
      button.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        canvas.focus({ preventScroll: true });
        button.setPointerCapture(event.pointerId);
        const dodge = button.id === 'dodge' && ![...pointers.values()].includes('dodge');
        pointers.set(event.pointerId, button.dataset.direction);
        publish(dodge);
      });
      button.addEventListener('pointermove', (event) => {
        if (!pointers.has(event.pointerId)) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        // Keep tracking the pointer outside the pad, but stop its movement.
        pointers.set(event.pointerId, target?.closest(button.id === 'dodge' ? '#dodge' : '#pad button')?.dataset.direction || null);
        publish();
      });
      button.addEventListener('pointerup', (event) => { pointers.delete(event.pointerId); publish(); });
      for (const type of ['pointercancel', 'lostpointercapture']) {
        button.addEventListener(type, (event) => {
          // A normal release already removed this ID; its automatic capture loss
          // must not cancel a second finger that is still moving the player.
          if (pointers.has(event.pointerId)) clearInput();
        });
      }
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    }
    for (const type of ['blur', 'pagehide', 'resize', 'orientationchange']) window.addEventListener(type, clearInput);
    document.addEventListener('visibilitychange', clearInput);
    window.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
    });

    function resizeCanvas() {
      clearInput();
      const stage = document.getElementById('stage');
      canvas.width = Math.max(1, Math.floor(stage.clientWidth * (devicePixelRatio || 1)));
      canvas.height = Math.max(1, Math.floor(stage.clientHeight * (devicePixelRatio || 1)));
    }
    new ResizeObserver(resizeCanvas).observe(document.getElementById('stage'));
    resizeCanvas();

    const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":121620,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const engine = new Engine(config);
    function failure(error) {
      window.playtestControls.unbind();
      status.hidden = false;
      status.textContent = `Could not start playtest.\n${error.message || error}\nReload to retry.`;
      console.error(error);
    }
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      failure(`This browser is missing: ${missing.join(', ')}. Try current Safari.`);
    } else {
      // Catch download rejection before Godot 4.6.3 init wraps the load promise.
      Engine.load(config.executable, config.fileSizes[`${config.executable}.wasm`]).then(() => engine.startGame({
        canvas,
        onProgress(current, total) {
          status.textContent = total > 0 ? `Loading playtest… ${Math.floor(current / total * 100)}%` : 'Loading playtest…';
        },
        onExit(code) { failure(`Game stopped (${code}).`); }
      })).then(() => { status.hidden = true; }, failure);
    }
  </script>
</body>
</html>
