<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121820">
  <link rel="icon" href="data:,">
  <title>Zombie Rebuilder - Melee Prototype</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #121820; color: #edf5f3;
      font: 16px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    #app { height: 100%; height: 100dvh; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center;
      padding: max(12px, var(--safe-top, env(safe-area-inset-top))) max(12px, var(--safe-right, env(safe-area-inset-right)))
        max(12px, var(--safe-bottom, env(safe-area-inset-bottom))) max(12px, var(--safe-left, env(safe-area-inset-left))); }
    #panel { grid-column: 2; grid-row: 1; align-self: stretch; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 4px; }
    #tools { display: flex; gap: 4px; align-items: center; min-height: 44px; flex-wrap: wrap; font-size: 12px; }
    #tools button, #tools select { min-width: 44px; min-height: 44px; color: #edf5f3; background: #253e38; border: 1px solid #89ada4; border-radius: 6px; font-size: 12px; }
    #encounter-status { margin-left: auto; }
    #ai-debug { flex-shrink: 0; height: 56px; overflow: auto; font-size: 12px; line-height: 18px; color: #e7c6dd; }
    #ai-debug[hidden] { display: none; }
    #stage { flex: 1; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-content: center;
      padding: 16px; background: #121820; text-align: center; white-space: pre-line; }
    #status[hidden] { display: none; }
    aside { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; gap: 12px; }
    p { margin: 0; text-align: center; max-width: 24em; font-size: 14px; }
    #pad { display: grid; grid-template: repeat(3, 44px) / repeat(3, 44px); gap: 4px;
      touch-action: none; user-select: none; -webkit-user-select: none; }
    #pad button, :is(#dodge, #attack) { min-width: 44px; min-height: 44px; border: 2px solid #89ada4; border-radius: 12px;
      background: #253e38; color: white; font: 28px system-ui; touch-action: none;
      -webkit-touch-callout: none; }
    #pad button[aria-pressed="true"], :is(#dodge, #attack)[aria-pressed="true"] { background: #387866; }
    #pad button:focus-visible, :is(#dodge, #attack):focus-visible { outline: 3px solid #f4c570; outline-offset: 2px; }
    #pad button:disabled, :is(#dodge, #attack):disabled { opacity: .4; }
    [data-direction="up"] { grid-area: 1 / 2; }
    [data-direction="left"] { grid-area: 2 / 1; }
    [data-direction="right"] { grid-area: 2 / 3; }
    [data-direction="down"] { grid-area: 3 / 2; }
    [data-direction="up-left"] { grid-area: 1 / 1; }
    [data-direction="up-right"] { grid-area: 1 / 3; }
    [data-direction="down-left"] { grid-area: 3 / 1; }
    [data-direction="down-right"] { grid-area: 3 / 3; }
    #actions { grid-column: 3; grid-row: 1; align-self: end; padding-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    :is(#dodge, #attack) { width: 64px; height: 64px; font-size: 14px; border-radius: 50%; }
    .arrow { display: inline-block; width: 12px; height: 12px; border-top: 3px solid currentColor;
      border-right: 3px solid currentColor; transform: rotate(var(--angle)); }
    #rotate { display: none; }
    #pad { align-self: end; }
    aside p { max-width: 148px; font-size: 12px; }
    #canvas { image-rendering: pixelated; }
    @media (orientation: portrait) {
      #app { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto; }
      #panel { grid-column: 1 / -1; grid-row: 1; }
      aside { grid-column: 1; grid-row: 2; }
      #actions { grid-column: 2; grid-row: 2; }
      #rotate { display: inline; }
    }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <main id="app">
    <section id="panel" aria-label="Combat playground">
      <div id="tools">
        <select id="mode" aria-label="Encounter mode" disabled><option value="0">Training</option><option value="1" selected>Encounter</option><option value="2">Crowd</option></select>
        <button id="reset" type="button" disabled>Reset</button>
        <button id="debug" type="button" aria-pressed="false" disabled>Debug</button>
        <select id="art-style" aria-label="Provisional art treatment" disabled><option value="0">A · outlined</option><option value="1" selected>B · balanced</option><option value="2">C · flat</option></select>
        <select id="quality" aria-label="Visual quality" disabled><option value="0">Standard FX</option><option value="1">Reduced FX</option></select>
        <span id="encounter-status" role="status">HP 100 · Living 4</span>
      </div>
      <output id="ai-debug" hidden aria-label="Zombie state awareness and density"></output>
    <section id="stage" aria-label="Melee training arena">
      <canvas id="canvas" tabindex="0" aria-label="Game. WASD or arrows to move; Space to dodge; J or click to attack."></canvas>
      <div id="status" role="status">Loading playtest…</div>
    </section>
    </section>
    <aside aria-label="Movement controls">
      <p>Move the teal survivor.<br>WASD / arrows<br>Space: dodge · J / click: attack</p>
      <div id="pad" role="group" aria-label="Eight-direction movement pad">
        <button type="button" data-direction="up-left" aria-label="Move up left" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 270deg"></span></button>
        <button type="button" data-direction="up-right" aria-label="Move up right" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 0deg"></span></button>
        <button type="button" data-direction="down-left" aria-label="Move down left" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 180deg"></span></button>
        <button type="button" data-direction="down-right" aria-label="Move down right" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 90deg"></span></button>
        <button type="button" data-direction="up" aria-label="Move up" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 315deg"></span></button>
        <button type="button" data-direction="left" aria-label="Move left" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 225deg"></span></button>
        <button type="button" data-direction="right" aria-label="Move right" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 45deg"></span></button>
        <button type="button" data-direction="down" aria-label="Move down" aria-pressed="false" disabled><span class="arrow" aria-hidden="true" style="--angle: 135deg"></span></button>
      </div>
      <p>003-C · courtyard study<br><span id="rotate">Rotate for a wider arena.</span></p>
    </aside>
    <div id="actions"><button id="attack" type="button" data-direction="attack" aria-label="Attack" aria-pressed="false" disabled>Attack</button><button id="dodge" type="button" data-direction="dodge" aria-label="Dodge" aria-pressed="false" disabled>Dodge</button></div>
  </main>
  <noscript>JavaScript is required to run this playtest.</noscript>
  <script src="index.js"></script>
  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const buttons = [...document.querySelectorAll('button[data-direction]')];
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], "up-left": [-1, -1], "up-right": [1, -1], "down-left": [-1, 1], "down-right": [1, 1] };
    const pointers = new Map();
    let receiver = null;

    function publish(dodge = false, reset = false, attack = false) {
      let x = 0, y = 0;
      const held = new Set(pointers.values());
      for (const direction of held) {
        if (!vectors[direction]) continue;
        x += vectors[direction][0]; y += vectors[direction][1];
      }
      for (const button of buttons) button.setAttribute('aria-pressed', String(held.has(button.dataset.direction)));
      if (receiver) receiver(x, y, dodge, reset, attack);
    }
    function clearInput() { pointers.clear(); publish(false, true); if (encounterReceiver) encounterReceiver("interrupt"); }
    window.playtestControls = {
      ready: false,
      bind(callback) {
        receiver = callback;
        this.ready = true;
        for (const button of buttons) button.disabled = false;
        clearInput();
      },
      unbind() {
        clearInput(); receiver = null; this.ready = false;
        for (const button of buttons) button.disabled = true;
      }
    };
    let encounterReceiver = null;
    const encounterTools = [...document.querySelectorAll('#mode, #reset, #debug')];
    window.playtestEncounter = {
      bind(callback) { encounterReceiver = callback; for (const tool of encounterTools) tool.disabled = false; },
      unbind() { encounterReceiver = null; for (const tool of encounterTools) tool.disabled = true; },
      status(health, living, defeated, mode, debug, details) {
        const output = document.querySelector("#ai-debug"); output.hidden = !debug; output.textContent = details;
        document.querySelector("#mode").value = String(mode);
        document.querySelector("#debug").setAttribute("aria-pressed", String(debug));
        document.querySelector('#encounter-status').textContent = defeated ? 'Defeated · resetting…' : `HP ${health} · Living ${living}`;
      }
    };
    document.querySelector('#mode').addEventListener('change', event => {
      clearInput(); if (encounterReceiver) encounterReceiver(event.target.value);
    });
    for (const name of ['reset', 'debug']) document.querySelector(`#${name}`).addEventListener('click', event => {
      clearInput();
      if (name === 'debug') event.target.setAttribute('aria-pressed', String(event.target.getAttribute('aria-pressed') !== 'true'));
      if (encounterReceiver) encounterReceiver(name);
    });
    let presentationReceiver = null;
    const artStyle = document.querySelector('#art-style');
    const quality = document.querySelector('#quality');
    window.playtestPresentation = {
      bind(callback) { presentationReceiver = callback; quality.disabled = false; artStyle.disabled = false; },
      unbind() { presentationReceiver = null; quality.disabled = true; artStyle.disabled = true; },
      status(value, style) { quality.value = String(value); artStyle.value = String(style); }
    };
    artStyle.addEventListener('change', event => {
      clearInput(); if (presentationReceiver) presentationReceiver(Number(quality.value), Number(event.target.value));
    });
    quality.addEventListener('change', event => {
      clearInput(); if (presentationReceiver) presentationReceiver(Number(event.target.value));
    });
    for (const button of buttons) {
      button.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        canvas.focus({ preventScroll: true });
        button.setPointerCapture(event.pointerId);
        const heldAttack = [...pointers.values()].includes('attack');
        const dodge = button.id === 'dodge' && ![...pointers.values()].includes('dodge');
        pointers.set(event.pointerId, button.dataset.direction);
        publish(dodge, false, button.id === "attack" && !heldAttack);
      });
      button.addEventListener('pointermove', (event) => {
        if (!pointers.has(event.pointerId)) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        // Keep tracking the pointer outside the pad, but stop its movement.
        pointers.set(event.pointerId, target?.closest(vectors[button.dataset.direction] ? '#pad button' : `#${button.id}`)?.dataset.direction || null);
        publish();
      });
      button.addEventListener('pointerup', (event) => { pointers.delete(event.pointerId); publish(); });
      for (const type of ['pointercancel', 'lostpointercapture']) {
        button.addEventListener(type, (event) => {
          // A normal release already removed this ID; its automatic capture loss
          // must not cancel a second finger that is still moving the player.
          if (pointers.has(event.pointerId)) clearInput();
        });
      }
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    }
    for (const type of ['blur', 'pagehide', 'resize', 'orientationchange']) window.addEventListener(type, clearInput);
    document.addEventListener('visibilitychange', clearInput);
    window.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'F1'].includes(event.code)) event.preventDefault();
    });

    function resizeCanvas() {
      clearInput();
      const stage = document.getElementById('stage');
      canvas.width = Math.max(1, Math.floor(stage.clientWidth * (devicePixelRatio || 1)));
      canvas.height = Math.max(1, Math.floor(stage.clientHeight * (devicePixelRatio || 1)));
    }
    new ResizeObserver(resizeCanvas).observe(document.getElementById('stage'));
    resizeCanvas();

    const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":240352,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const engine = new Engine(config);
    function failure(error) {
      window.playtestControls.unbind();
      window.playtestEncounter.unbind();
      status.hidden = false;
      status.textContent = `Could not start playtest.\n${error.message || error}\nReload to retry.`;
      console.error(error);
    }
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      failure(`This browser is missing: ${missing.join(', ')}. Try current Safari.`);
    } else {
      // Catch download rejection before Godot 4.6.3 init wraps the load promise.
      Engine.load(config.executable, config.fileSizes[`${config.executable}.wasm`]).then(() => engine.startGame({
        canvas,
        onProgress(current, total) {
          status.textContent = total > 0 ? `Loading playtest… ${Math.floor(current / total * 100)}%` : 'Loading playtest…';
        },
        onExit(code) { failure(`Game stopped (${code}).`); }
      })).then(() => { status.hidden = true; }, failure);
    }
  </script>
</body>
</html>
